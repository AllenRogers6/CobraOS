name: CobraCI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test 32-bit x86 ISO
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            nasm \
            xorriso \
            grub-pc-bin \
            grub-common \
            mtools \
            qemu-system-x86 \
            qemu-utils \
            file \
            binutils

      - name: Show toolchain versions
        run: |
          gcc --version | head -1
          nasm -v
          grub-mkrescue --version | head -1
          qemu-system-i386 --version | head -1

      - name: Build ISO
        run: |
          make clean
          make

      - name: Verify build artifacts
        run: |
          test -f arch/x86/build/kernel.elf
          test -f arch/x86/build/cobraOS.bin

          ISO=$(find arch/x86 -maxdepth 1 -name 'cobra-x86-*.iso' -print -quit)

          if [ -z "$ISO" ]; then
            echo "::error::CobraOS ISO was not produced"
            exit 1
          fi

          echo "ISO: $ISO"

          ls -lh \
            arch/x86/build/kernel.elf \
            arch/x86/build/cobraOS.bin \
            "$ISO"

          file \
            arch/x86/build/kernel.elf \
            arch/x86/build/cobraOS.bin \
            "$ISO"

      - name: Verify Multiboot header
        run: |
          if grub-file --is-x86-multiboot arch/x86/build/kernel.elf; then
            echo "Multiboot header: OK"
          else
            echo "::error::kernel.elf is not Multiboot compliant"
            exit 1
          fi

      - name: Boot CobraOS in QEMU
        run: |
          ISO=$(find arch/x86 -maxdepth 1 -name 'cobra-x86-*.iso' -print -quit)

          set +e

          timeout 30s \
            qemu-system-i386 \
              -cdrom "$ISO" \
              -m 128M \
              -serial stdio \
              -no-reboot \
              -no-shutdown \
              -display none \
              > qemu-serial.log 2>&1

          QEMU_EXIT=$?

          set -e

          echo "QEMU exit code: $QEMU_EXIT"
          echo
          echo "CobraOS serial output"
          cat qemu-serial.log

          if grep -Eqi \
            "Triple fault|cpu_reset|check_exception|kernel panic|panic:" \
            qemu-serial.log; then
              echo "::error::CobraOS crashed during boot"
              exit 1
          fi

          # temporarily disabled until we have serial fixed
          # if ! grep -q "CI_BOOT_OK" qemu-serial.log; then
          #   echo "::error::CobraOS never reached CI_BOOT_OK"
          #   exit 1
          # fi

          echo "CobraOS boot test: PASS"

      - name: Upload QEMU serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobra-qemu-serial-log
          path: qemu-serial.log
          retention-days: 14

      - name: Upload CobraOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobra-x86-build
          path: |
            arch/x86/build/kernel.elf
            arch/x86/build/cobraOS.bin
            arch/x86/cobra-x86-*.iso
          retention-days: 14
